[package]
name = "pwe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pwe"
path = "src/main.rs"

[dependencies]
pwe-protocol = { path = "../pwe-protocol" }
pwe-domain = { path = "../pwe-domain" }
pwe-application = { path = "../pwe-application" }
pwe-adapters = { path = "../pwe-adapters" }
pwe-daemon = { path = "../pwe-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
toon-format = { version = "0.7.0", default-features = false }


[dev-dependencies]
rustix = { version = "1", features = ["process"] }

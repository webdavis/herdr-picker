[package]
name = "herdr-picker-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
herdr-picker-domain = { path = "../herdr-picker-domain" }
herdr-picker-application = { path = "../herdr-picker-application" }
herdr-picker-protocol = { path = "../herdr-picker-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
crossterm = { version = "0.29", default-features = false, features = [
  "bracketed-paste",
  "events",
] }
rustix = { version = "1", features = ["process"] }
